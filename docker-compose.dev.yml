services:
  app:
    image: laravel-inertia-datatable-app:dev
    build:
      context: .
      target: development
    init: true
    env_file: .env
    environment:
      APP_DEBUG: "true"
      APP_ENV: local
      APP_URL: http://localhost:${APP_PORT:-8080}
      COMPOSER_ALLOW_SUPERUSER: "1"
      DB_ROOT_PASSWORD: ""
      DB_CONNECTION: mysql
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_HOST: mysql
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-laravel}
      DB_PORT: 3306
      DB_USERNAME: ${DOCKER_DB_USERNAME:-laravel}
    command:
      - sh
      - -c
      - |
        set -e
        composer install --no-interaction
        mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
        chown -R www-data:www-data storage bootstrap/cache
        php artisan migrate --force
        exec php-fpm
    volumes:
      - .:/var/www
      - vendor:/var/www/vendor
      - app_storage:/var/www/storage
      - app_cache:/var/www/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket = @fsockopen('127.0.0.1', 9000); exit($$socket ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www:ro
      - app_storage:/var/www/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  vite:
    image: node:24-alpine
    init: true
    working_dir: /var/www
    environment:
      VITE_APP_NAME: ${APP_NAME:-Laravel}
    command: ["sh", "-c", "npm ci --no-audit && exec npm run dev -- --host 0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/var/www
      - node_modules:/var/www/node_modules
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-laravel}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  app_cache:
  app_storage:
  mysql_data:
  node_modules:
  vendor:
